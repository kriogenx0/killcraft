# Builds the game's Docker image on GitHub's machines and publishes it to GitHub's container
# registry (ghcr.io/kriogenx0/killcraft), then tells Coolify to deploy it. The game server's own
# machine only pulls and runs the image, so builds no longer slow down live matches.
#
# Coolify app "killcraft-image" (uuid below) runs the image ghcr.io/kriogenx0/killcraft:latest.
# The one repository secret needed is COOLIFY_TOKEN: a Coolify API token with only "deploy" rights.
# Until it is set, this only publishes the image.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true # a newer push replaces a build still running

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # reuse unchanged layers (npm install) between builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tell Coolify to deploy it
        env:
          COOLIFY_URL: https://coolify.homecloud.one
          COOLIFY_APP: f76ifkxa3zgxydrxhcrjekdc
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then echo "No COOLIFY_TOKEN secret yet: image published, not deployed."; exit 0; fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP&force=false"
