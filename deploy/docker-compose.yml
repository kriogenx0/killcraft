services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "${PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
